<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="ROOG Studio is a browser modular synth: step and euclidean sequencers, a drum grid, west-coast voices, tape echo, MIDI and a live visualizer."
    />
    <title>ROOG Studio — Browser Modular</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='13' fill='%23222' stroke='%23e8a33c' stroke-width='4'/%3E%3Ccircle cx='16' cy='16' r='5' fill='%23000'/%3E%3C/svg%3E"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;600;700;800;900&family=JetBrains+Mono:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./src/studio.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar" aria-label="ROOG Studio">
        <div class="brand">
          <p class="brand-tag">
            Browser modular · one clock · every jack is voltage
          </p>
          <h1 class="logo">ROOG <span class="logo-sub">STUDIO</span></h1>
        </div>
        <div class="status-cluster">
          <a class="page-link" href="./index.html">← Patch bay</a>
          <p class="status-strip" aria-live="polite">
            <span class="status-light" aria-hidden="true"></span>
            <span data-status-text>Loading rack…</span>
          </p>
        </div>
      </header>

      <div class="control-bar" aria-label="Transport and patch controls">
        <div class="control-group">
          <button
            class="ctrl-btn ctrl-power"
            data-power
            type="button"
            aria-pressed="false"
          >
            <span class="ctrl-led" aria-hidden="true"></span>
            <span class="ctrl-label">Power</span>
          </button>
          <button
            class="ctrl-btn ctrl-play"
            data-play
            type="button"
            aria-pressed="false"
            title="Space bar"
          >
            <span class="ctrl-led" aria-hidden="true"></span>
            <span class="ctrl-label">Play</span>
          </button>
        </div>

        <div class="control-group">
          <label class="lcd">
            <span class="lcd-label">BPM</span>
            <input
              class="lcd-input"
              data-bpm
              type="number"
              min="20"
              max="300"
              step="1"
              value="120"
            />
          </label>
          <button
            class="ctrl-btn ctrl-small"
            data-tap
            type="button"
            title="Tap in time to set the tempo"
          >
            <span class="ctrl-label">Tap</span>
          </button>
          <label class="swing">
            <span class="lcd-label">Swing</span>
            <input
              data-swing
              type="range"
              min="0"
              max="1"
              step="0.01"
              value="0"
            />
          </label>
        </div>

        <div class="control-group">
          <label class="preset-picker">
            <span class="lcd-label">Patch</span>
            <select
              class="preset-select"
              data-preset
              aria-label="Load a factory patch"
            >
              <option value="" disabled>— your patch —</option>
            </select>
          </label>
          <button class="ctrl-btn ctrl-accent" data-add type="button">
            <span class="ctrl-label">+ Module</span>
          </button>
          <button
            class="ctrl-btn"
            data-share
            type="button"
            title="Copy a link that rebuilds this exact patch"
          >
            <span class="ctrl-label">Share</span>
          </button>
          <button
            class="ctrl-btn ctrl-rec"
            data-record
            type="button"
            aria-pressed="false"
            title="Record the master output"
          >
            <span class="ctrl-led" aria-hidden="true"></span>
            <span class="ctrl-label">Rec</span>
          </button>
          <button
            class="ctrl-btn"
            data-cables
            type="button"
            title="Cycle cable visibility: solid, ghosted, hidden"
          >
            <span class="ctrl-label">Cables: solid</span>
          </button>
          <button
            class="ctrl-btn"
            data-learn
            type="button"
            aria-pressed="false"
            title="Map MIDI controller knobs to rack knobs"
          >
            <span class="ctrl-label">MIDI learn</span>
          </button>
          <button class="ctrl-btn ctrl-warn" data-clear type="button">
            <span class="ctrl-label">Clear</span>
          </button>
        </div>

        <span class="hp-readout" data-hp-readout aria-label="Rack usage"></span>
      </div>

      <section class="visualizer" aria-label="Music visualizer">
        <canvas
          class="visualizer-canvas"
          data-visualizer
          role="img"
          aria-label="Live visualization of the master output"
        ></canvas>
        <div class="visualizer-modes" role="group" aria-label="Visualizer mode">
          <button type="button" data-vis-mode="orbit" aria-pressed="true">
            Orbit
          </button>
          <button type="button" data-vis-mode="spectrum" aria-pressed="false">
            Spectrum
          </button>
          <button type="button" data-vis-mode="waterfall" aria-pressed="false">
            Waterfall
          </button>
          <button type="button" data-vis-full title="Fullscreen">⛶</button>
        </div>
      </section>

      <main class="stage">
        <div class="case">
          <span class="case-cheek" aria-hidden="true"></span>
          <div class="rack-frame">
            <div class="rack-inner">
              <div class="rack-rows" data-rack-rows></div>
              <svg
                class="cable-layer"
                data-cable-layer
                aria-label="Patch cables"
              ></svg>
            </div>
          </div>
          <span class="case-cheek" aria-hidden="true"></span>
        </div>
      </main>

      <footer class="footnote">
        <span
          >Drag jack → jack to patch · click a cable to pull it · grab a patched
          input to move its cable</span
        >
        <span
          >Knobs: drag up/down, shift for fine, double-click to reset · drag a
          module's name to move it</span
        >
      </footer>
    </div>

    <dialog class="drawer" data-drawer aria-labelledby="drawer-title">
      <header class="drawer-header">
        <h2 id="drawer-title">Add a module</h2>
        <button
          type="button"
          class="drawer-close"
          data-drawer-close
          aria-label="Close"
        >
          ×
        </button>
      </header>
      <div class="drawer-body" data-drawer-body></div>
    </dialog>

    <script type="module" src="./src/studio/main.js"></script>
  </body>
</html>
